[core]
# enable debug mode
debug = true
heartbeat = 30
server_id = 1   #服务器唯一ID

#WEB服务器设置
[webserver]
addr = "0.0.0.0:12307"                         #监听地址
enable_ssl = true                            #是否使用https, 如果为true, 则必须配置cert和key的路径
static_dir = "web/static"

#证书设置
[webserver.certificates]
cert = "configs/cert/shbinqigame.com_public.crt"       #证书路径
key = "configs/cert/shbinqigame.com.key"        #Key路径

[game-server]
host = "192.168.0.121"
port = 7000
listen_port = 7000

# Redis server config
[redis]
host = "192.168.13.75"
port = 6379
auth = ""
max_idle = 10
max_active = 1000
idle_timeout = 60
index_db = 1
conn_fail_retry_times = 3
reconnect_interval = 1

# Mysql server config
[database]
host = "127.0.0.1"
port = 3306
dbname = "game_mow"
password = "123456"
username = "root"
args = "charset=utf8mb4"
buf_size = 10
max_idle_conns = 20
max_open_conns = 15
show_sql = false

# 微信
[wechat]
appid = "YOUR_WX_APPID"
appsecret = "YOUR_APP_SECRET"
callback_url = "YOUR_CALLBACK"
mer_id = "YOUR_MER_ID"
unify_order_url = "https://api.mch.weixin.qq.com/pay/unifiedorder"

#Token设置
[token]
jwtTokenSignKey = "mowserver"     #设置token生成时加密的签名
jwtTokenOnlineUsers = 1          #一个账号密码允许最大获取几个有效的token，当超过这个值，第一次获取的token的账号、密码就会失效
jwtTokenCreatedExpireAt = 28800   #创建时token默认有效秒数（token生成时间加上该时间秒数，算做有效期）,3600*8=28800 等于8小时
jwtTokenRefreshAllowSec = 86400   #对于过期的token，允许在多少小时之内刷新，超过此时间则不允许刷新换取新token，86400=3600*24，即token过期24小时之内允许换新token
jwtTokenRefreshExpireAt = 36000   #对于过期的token，支持从相关接口刷新获取新的token，它有效期为10个小时，3600*10=36000 等于10小时
bindContextKeyName = "userToken"  #用户在 header 头部提交的token绑定到上下文时的键名，方便直接从上下文(gin.context)直接获取每个用户的id等信息

#白名单设置
[whitelist]
ip = ["10.10.*", "127.0.0.1", ".*"]                 #白名单地址, 支持golang正则表达式语法

#分享信息
[share]
title = "mow"
desc = "随时随地尽情游戏"

#更新设置
[update]
force = true #是否强制更新
version = "1.0.0"
android = "https://fir.im/tand"
ios = "https://fir.im/tios"

#联系设置
[contact]
daili1 = "kefuweixin01"
daili2 = "kefuweixin01"
kefu1 = "kefuweixin01"

#语音账号http://gcloud.qq.com/product/6
[voice]
appid = "xxx"
appkey = "xxx"

#广播消息
[broadcast]
message = ["系统消息：随时随地尽情游戏", "欢迎进入游戏"]

#登陆相关
[login]
guest = true
lists = ["test"]