// 属性来源
enum AttrSource {
	INVALID_AttrSource = 0;
	STRENGTHEN	= 1; //强化
}


enum DeskStatus {
	INVALID_DeskStatus = 0; // 未知状态
    DESK_STATUS_CREATE = 1; // 创建桌子
    DESK_STATUS_PLAYING = 2; // 游戏中
    DESK_STATUS_IDLE = 3; // 已经清理，即为下一轮准备好
    DESK_STATUS_DESTROY = 4; // 已销毁
}

// 房间信息
message RoomInfo{
	int32 RoomId = 1; 		//房间ID
	string Name = 2;		//房间名字
	int32 GameType = 3; 	//游戏类型
	int32 MinEntryLimit = 4; // 最低进入限制
	int32 MaxEntryLimit = 5; // 最高进入限制
	int32 PlayerNum = 6;
}

//桌子信息
message TableInfo {
	int32 		RoomCfgId = 1; 	//房间配表ID
	int64 		RoomUid = 2; 	//房间唯一ID
	repeated  MonsterInfo  MonsterList= 3; //房间内怪物列表
	int32 		BattleId = 4; //战斗ID
}

//实例类型
enum ObjectType{
	INVALID_ObjectType  = 0;
	PLAYER   = 1;
	PARTNER  = 2; //伙伴
	MONSTER  = 3;
	ROBOT    = 4;
	BUFF     = 5;
	DECOY    = 6; //替身
}
//通用实例
message ObjectInfo{
	ObjectType  Type 		= 1;
	int64    	Uid         = 2;
	int32	 	CfgID 		= 3;
	int32  		Level 		= 4;
	string   	Name		= 5;
	Point    	Location    = 6;
	Direction 	Direction 	= 7;
	int32 		MaxHp 		= 8;
	int32   	CurHp 		= 9;
	int64  		OwnerUid 	= 10; //主人Uid
	repeated BuffInfo BuffList 	= 11;
	repeated Stats Attributes 	= 12;
}

//玩家简明信息
message PlayerInfo{
	int64    Uid            = 1;
	string   Nickname       = 2;
	string   HeadUrl        = 3;
	Point    Location       = 4;
	Direction Direction 	= 5;
	int32  	Level 	= 6;
	int32  	Job 	= 7;  //1战， 2法， 3祭
	int32 	MaxHp 	= 8;
	int32   CurHp 	= 9;
	int32  	Gender 	= 10;
	repeated BuffInfo BuffList 	= 11;
	int32  	FateLevel 	= 12;
	int32  	FateExp 	= 13;
	repeated ObjectInfo PartnerList 	= 14; //伙伴列表
	int64 	GuildId = 15;
	string 	GuildName = 16;
	int32   TitleId = 17;
	int64 OfficialExp = 18;
}

 // 伙伴信息
 message PartnerSceneInfo{
    int64 Uid = 1;  //唯一id
    int32 CfgId = 2;  //configid
    int32 Level = 3;
    int32 Star = 4;
	Point    Location       = 5;
	Direction Direction 	= 6;
	int32 	MaxHp 	= 7;
	int32   CurHp 	= 8;
	int64  OwnerUid = 9; //主人Uid
	repeated BuffInfo BuffList 	= 10;
}

//归属类型
enum OwnershipType{
	OWNERSHIP_NONE = 0;   //无归属
	OWNERSHIP_PLAYER = 1; //玩家归属
	OWNERSHIP_GUILD = 2;  //公会归属
}

// 归属
message Ownership{
	OwnershipType 	Type 	= 1;	//怪物归属类型
	int64 			Uid 	= 2;	//怪物归属ID
	string 			Name 	= 3;	//归属名字
}
//怪物信息
message MonsterInfo{
	int32    	CfgId			= 1;  	//配置ID
	int64    	Uid            	= 2;  	//唯一ID
	string   	Name       		= 3;
	int32    	MaxHp     	    = 4;	//最大血量
	int32    	CurHp     	    = 5;	//当前血量
	Point    	Location       	= 6;	//位置
	Direction 	Direction  		= 7;	//朝向
	repeated BuffInfo BuffList 	= 8;
	Ownership Ownership 		= 9;    //归属
}

 // 宠物信息
 message PetSceneInfo{
    int64 Uid = 1;  //唯一id
    int32 CfgId = 2;  //configid
    int32 Level = 3;
    int32 Star = 4;
	int64  OwnerUid = 5; //主人Uid
	repeated BuffInfo BuffList 	= 6;
}
// 装备信息
message EquipInfo{
	repeated Stats Attributes = 1;
	ItemQuality 	Quality = 2; // 品质
}

// 定义道具种类的枚举
enum ItemType {
	// 代表不进入包裹的数值类道具
	NOT_IN_BAG = 0;
	// 代表进入包裹且可被销毁的道具
	IN_BAG_DISPOSABLE = 1;
	// 代表进入包裹且可被销毁和使用的道具
	IN_BAG_DISPOSABLE_AND_USABLE = 2;
	// 代表进入包裹、可被销毁、带有时效的道具
	IN_BAG_TIME_LIMITED = 3;
	// 代表进入包裹、可被销毁和使用、带有时效的道具
	IN_BAG_DISPOSABLE_USABLE_TIME_LIMITED = 4;
	// 代表装备类，该类道具可装备、可分解
	EQUIPMENT = 5;
}

// 道具品质
enum ItemQuality {
    INVALID_Quality = 0;
    WHITE 	= 1; 	// 1 代表白色品质
    GREEN 	= 2; 	// 2 代表绿色品质
    BLUE 	= 3;  	// 3 代表蓝色品质
    PURPLE 	= 4;	// 4 代表紫色品质
    PINK 	= 5;	// 5 代表粉色品质
    ORANGE 	= 6;	// 6 代表橙色品质
    RED 	= 7;	// 7 代表红色品质
	Rainbow = 8;	// 8 代表彩虹品质
}

// 道具信息
message ItemInfo{
	int32   	CfgId		= 1;  //配置ID
	int64 		Uid 		= 2;
	int64   	Num     	= 3;
	int64   	CreateTime 	= 4;
	ItemType 	Type 		= 5;  //道具类型
	EquipInfo 	Equip 		= 6;  //装备属性
}

message Bag{
	repeated ItemInfo ItemList = 1;
}

message DailyItemUsed {
	int32 CfgId = 1; //道具配置ID
	int64 Num = 2; //使用数量
}

