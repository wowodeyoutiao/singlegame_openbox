//任务状态
enum TaskStatus{
	INVALID_TaskStatus = 0; // 无效
    IN_PROGRESS = 1;     // 任务进行中
    COMPLETED = 2;       // 任务已完成
    REWARDED = 3;        // 奖励已领取
}

//任务目标
message TargetInfo{
	TargetType Type =1;  //类型
	int32 TargetId   =2;  //目标ID,根据TargetType决定
	int32 TargetNum  =3;  //目标数量
	int32 Amount     =4;  //已完成的数量
	bool Completed   =5;  //目标是否已经完成
}

//任务信息
message TaskInfo{
	int32   	CfgId	= 1;  	//任务配置ID
	TaskClass 	Class 	= 2;    //任务类型
	TaskStatus  Status 	= 3;    //状态
	TargetInfo  Target 	= 4;
	int64 RefreshTime 	= 5;
}

message DBTask{
	repeated TaskInfo Tasks = 1;
}

message TitleInfo{
    int32 CfgId = 1;
    int32 Star = 2;  // 星级
    int32 ActivationTime = 3; //激活时间(时间戳)
}
message DBTitle{
	repeated TitleInfo Titles = 1;
}

message SkillInfo{
	int32   	CfgId		= 1;  	//配置ID
	int64		Cooldown 	= 2;	//冷却时间
	int32		Advanced 	= 3;	//进阶等级
}

message BuffInfo{
    int32 BuffId   = 1;  //配置ID
    int32 RemainingTime = 2; //剩余时间(秒)
	repeated Stats BuffStats = 3; // 属性
	int64 OwnerUid =4 ;  //释放者UID
}

// 定义 BuffInfo 消息类型
message DBBuffInfo {
	int32 Id = 1; // buffID
	int32 BuffType = 2; // 类型 1 代表为增益效果，2 代表为减益效果
	int32 Mark = 3; // 1 被动，1000 技能引用的效果
	repeated Stats BuffStats = 4; // 属性
	int64 StartTime = 5; // 创建时间
	int64 OverTime = 6; // 结束时间
	int64 TickTime = 7; // 生效间隔
	int64 CDTime = 8; // 冷却时间
	int32 TickFrequency = 9;
	int32 Pretype = 10; // 大类
	int64 OwnerId = 11; // 拥有者
	int32 Status = 12; // 状态
}
message DBBuffList {
	repeated DBBuffInfo buffs = 1;
}

//PVP类型
enum MatchType{
	INVALID_MatchType = 0;
    SINGLE_COMBAT = 3;    // 1对1的对战
    FREE_FOR_ALL = 4;    // 混战模式
}
message Rank {
		int64 Uid =1 ;  //
		int64 Num = 2 ;     //名次
		string Avatar= 3 ;//头像
		string Name = 4 ;  //昵称
		int64 Value= 5 ;   //数值
