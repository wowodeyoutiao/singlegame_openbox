		int32 Job = 7;//职业
		int32 RobotCId = 8;//机器人ID
		string ServerName = 9;//服务器
		int32 AvatarV2 = 10;//头像
		int32 Frame = 11;//头像框

}
message RankInfo {
	repeated Rank List =1;
}

