// CharacterSlot 枚举定义，表示角色槽位
enum CharacterSlot {
	CHARACTER_SLOT_UNSPECIFIED = 0; // 未指定/默认值
  CHARACTER_SLOT_1 = 1;            // 槽位 1
  CHARACTER_SLOT_2 = 2;            // 槽位 2
  CHARACTER_SLOT_3 = 3;            // 槽位 3
  CHARACTER_SLOT_4 = 4;            // 槽位 4
  CHARACTER_SLOT_5 = 5;            // 槽位 5
	CHARACTER_SLOT_MAX = 6;          // 最大槽位数
}

// RefinedSlot 枚举定义，表示洗练槽位的索引
