  REFINED_SLOT_2 = 2;            // 洗练槽位 2
  REFINED_SLOT_3 = 3;            // 洗练槽位 3
  REFINED_SLOT_4 = 4;            // 洗练槽位 4
	REFINED_SLOT_MAX = 5;            // 最大槽位数
}

