message EmptyMessage{}


enum Direction {
	// 向上方向
	UP = 0;
	// 向上且向右方向
	UP_RIGHT = 1;
	// 向右方向
	RIGHT = 2;
	// 向下且向右方向
	DOWN_RIGHT = 3;
	// 向下方向
	DOWN = 4;
	// 向下且向左方向
	DOWN_LEFT = 5;
	// 向左方向
	LEFT = 6;
	// 向上且向左方向
	UP_LEFT = 7;
	// 无方向，通常用作默认值或无效值
	NONE = 255;
}

//坐标
message Point{
	double X = 1;
	double Y = 2;
}

// 属性
message Stats{
	Attribute attr = 1;  // 枚举
	int32 	Num = 2;     // 值
}

//通用键值对
message KeyValue{
	int32 K = 1;
	int32 V = 2;
}

