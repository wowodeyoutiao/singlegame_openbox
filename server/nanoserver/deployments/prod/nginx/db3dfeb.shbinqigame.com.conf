# HTTP 重定向到 HTTPS
server {
  listen 80;
  server_name db3dfeb.shbinqigame.com;
  return 301 https://$host$request_uri;
}

# HTTPS 主配置
server {
  listen 443 ssl;
  http2 on;
  server_name db3dfeb.shbinqigame.com;
  root /var/www/db3dfeb.shbinqigame.com/go-admin-ui;

  # SSL 配置
  ssl_certificate /etc/nginx/certs/shbinqigame.com.pem;
  ssl_certificate_key /etc/nginx/certs/shbinqigame.com.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # 安全头
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;

  # 基本配置
  client_max_body_size 20M;
  server_tokens off;

  # 日志配置
  access_log /var/log/nginx/db3dfeb.shbinqigame.com.access.log;
  error_log /var/log/nginx/db3dfeb.shbinqigame.com.error.log;

  # gzip 压缩
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_vary on;

  # 静态文件缓存
  location ~ \.(js|css|png|jpg|svg|woff|ttf|ico)$ {
    expires 30d;
    add_header Cache-Control "public, no-transform";
  }

  # 后台API代理
  location /goadminapi/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
  }

  # 前端路由处理
  location / {
    try_files $uri $uri/ /index.html;
  }
}