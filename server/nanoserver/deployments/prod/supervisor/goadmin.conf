[program:goadmin]
command=/data/goadmin/go-admin server -c=config/settings.yml
directory=/data/goadmin
user=root
autostart=true
autorestart=true
startsecs=3
stopsignal=INT
stopwaitsecs=15
stdout_logfile=/var/log/supervisor/goadmin.log
stderr_logfile=/var/log/supervisor/goadmin-error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3