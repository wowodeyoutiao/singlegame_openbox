[program:payment]
command=/data/payment/server -conf=config.yaml
directory=/data/payment
user=root
autostart=true
autorestart=true
startsecs=3
stopsignal=INT
stopwaitsecs=15
stdout_logfile=/var/log/supervisor/payment.log
stderr_logfile=/var/log/supervisor/payment-error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3