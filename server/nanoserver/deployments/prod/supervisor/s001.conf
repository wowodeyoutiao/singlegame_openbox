[program:s001]
command=/data/s001/mowserver
directory=/data/s001
;user=appuser
autostart=true
autorestart=true
startsecs=3
stopsignal=INT
stopwaitsecs=15
stdout_logfile=/var/log/supervisor/s001.log
stderr_logfile=/var/log/supervisor/s001-error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
;environment=GO_ENV="production",PORT="8080"