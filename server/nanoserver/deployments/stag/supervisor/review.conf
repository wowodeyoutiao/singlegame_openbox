[program:review]
command=/data/project/review/mowserver
directory=/data/project/review
;user=appuser
autostart=true
autorestart=true
startsecs=3
stopsignal=INT
stopwaitsecs=15
stdout_logfile=/var/log/supervisor/review.log
stderr_logfile=/var/log/supervisor/review-error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3