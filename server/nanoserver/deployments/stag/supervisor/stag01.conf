[program:stag01]
command=/data/project/stag01/mowserver
directory=/data/project/stag01
;user=appuser
autostart=true
autorestart=true
startsecs=3
stopsignal=INT
stopwaitsecs=15
stdout_logfile=/var/log/supervisor/stag01.log
stderr_logfile=/var/log/supervisor/stag01-error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3