# HTTP 重定向到 HTTPS
server {
  listen 80;
  server_name stag01.shbinqigame.com;
  return 301 https://$host$request_uri;
}

# HTTPS 主配置
server {
  listen 443 ssl http2;
  server_name stag01.shbinqigame.com;

  # SSL 配置
  ssl_certificate /etc/nginx/certs/shbinqigame.com.pem;
  ssl_certificate_key /etc/nginx/certs/shbinqigame.com.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # 安全头
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;

  # 日志配置
  access_log /var/log/nginx/stag01.shbinqigame.com.access.log;
  error_log /var/log/nginx/stag01.shbinqigame.com.error.log;

  # 基本配置
  client_max_body_size 20M;
  server_tokens off;


  # WebSocket 转发 - 游戏服务
  location /game/ {
    proxy_pass http://127.0.0.1:18002/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # HTTP 请求转发 - Web 服务
  location /web/ {
    proxy_pass http://127.0.0.1:19002/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }
}